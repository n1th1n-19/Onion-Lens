name: Release

# Releases the version already in manifest.json on main.
# Bump the version through a PR first (main is protected), then run this.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Only release from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run the Release workflow on main (got $GITHUB_REF_NAME)"
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read version
        id: version
        run: |
          version=$(node -p "require('./manifest.json').version")
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version is already released — bump \"version\" in manifest.json via a PR first"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: node test.js

      - name: Pack
        run: ./pack.sh

      - name: Lint Firefox package (AMO rules)
        run: npx --yes web-ext@8 lint --source-dir dist/*-firefox.zip

      # gh creates the tag on this commit server-side; nothing is pushed to main
      - name: Tag and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.version.outputs.version }}
        run: |
          cat > notes.md <<NOTES
          ## Which file?

          | File | Use it for |
          |---|---|
          | \`onion-lens-$V-chrome-unpacked.zip\` | **Chrome / Edge / Brave / Opera / Vivaldi**: extract it, open \`chrome://extensions\`, turn on *Developer mode* → **Load unpacked** → pick the extracted \`onion-lens-$V-chrome\` folder |
          | \`onion-lens-$V-firefox-unpacked.zip\` | **Firefox**: extract it, open \`about:debugging#/runtime/this-firefox\` → **Load Temporary Add-on…** → pick \`manifest.json\` inside the extracted folder |
          | \`onion-lens-$V-chrome.zip\` | Upload to the Chrome Web Store, Edge Add-ons or Opera add-ons |
          | \`onion-lens-$V-firefox.zip\` | Upload to Firefox Add-ons (AMO) |

          NOTES
          gh release create "v$V" dist/*.zip --target "$GITHUB_SHA" --title "Onion Lens v$V" --notes-file notes.md --generate-notes
