name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests
        run: node test.js

      - name: Pack
        run: ./pack.sh

      - name: Lint packed extension (Firefox / AMO rules)
        run: npx --yes web-ext@8 lint --source-dir dist/*-firefox.zip

      - uses: actions/upload-artifact@v4
        with:
          name: onion-lens
          path: dist/*.zip

